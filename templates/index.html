<!DOCTYPE HTML>
<html>
  <head>
    <title>Chat</title>
     <style>
      *{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:Arial, Helvetica, sans-serif;
}

body{
  background:
    radial-gradient(circle at top left,#1b2235 0%,#0b0f18 45%),
    radial-gradient(circle at bottom right,#2d1d10 0%,transparent 35%);
  color:#f5f7ff;
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  padding:20px;
}

#chat{
  display:none;
}

#error{
  display:none;
}

.joinChat,
#chat{
  width:90%;
  max-width:560px;
  background:#121826;
  border:1px solid rgba(255,255,255,0.06);
  border-radius:24px;
  overflow:hidden;
  box-shadow:
    0 10px 40px rgba(0,0,0,0.5),
    0 0 0 1px rgba(255,255,255,0.02);
  backdrop-filter:blur(10px);
}

.navbar{
  background:linear-gradient(
    135deg,
    #1d4ed8 0%,
    #2563eb 55%,
    #f97316 100%
  );
  padding:24px;
  border-bottom:1px solid rgba(255,255,255,0.08);
}

.navbar h1{
  font-size:26px;
  color:white;
  text-align:center;
  letter-spacing:0.5px;
  font-weight:700;
}

.joinChat{
  padding-bottom:28px;
}

input{
  width:calc(100% - 40px);
  margin:20px 20px 0 20px;
  padding:16px;
  border:none;
  border-radius:14px;
  background:#1b2435;
  color:white;
  font-size:16px;
  outline:none;
  border:1px solid transparent;
  transition:0.25s;
}

input::placeholder{
  color:#93a0ba;
}

input:focus{
  border:1px solid #3b82f6;
  box-shadow:
    0 0 0 4px rgba(59,130,246,0.15),
    0 0 18px rgba(59,130,246,0.25);
}

button{
  width:calc(100% - 40px);
  margin:20px 20px 0 20px;
  padding:15px;
  border:none;
  border-radius:14px;
  font-size:16px;
  font-weight:bold;
  cursor:pointer;
  transition:0.2s;
}

.joinButton{
  background:linear-gradient(135deg,#2563eb,#3b82f6);
  color:white;
  box-shadow:0 6px 20px rgba(37,99,235,0.35);
}

.joinButton:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(37,99,235,0.45);
}

.createClass{
  background:linear-gradient(135deg,#ea580c,#fb923c);
  color:white;
  box-shadow:0 6px 20px rgba(249,115,22,0.3);
}

.createClass:hover{
  transform:translateY(-2px);
  box-shadow:0 10px 25px rgba(249,115,22,0.45);
}

.error{
  margin:20px;
  padding:14px;
  border-radius:14px;
  background:rgba(220,38,38,0.12);
  border:1px solid rgba(248,113,113,0.3);
}

.errorText{
  color:#fca5a5;
  text-align:center;
  font-size:15px;
}

.messages{
  padding:20px;
  min-height:300px;
  max-height:400px;
  overflow-y:auto;
  background:#0f1725;
}

.messages::-webkit-scrollbar{
  width:8px;
}

.messages::-webkit-scrollbar-thumb{
  background:#334155;
  border-radius:20px;
}

.message{
  background:#1e293b;
  border-left:4px solid #3b82f6;
  padding:14px;
  margin-bottom:14px;
  border-radius:14px;
  animation:fadeIn 0.2s ease;
}

.message b{
  color:#60a5fa;
}

.chatInputArea{
  padding-bottom:20px;
}

#postMessage{
  margin-top:0;
}

@keyframes fadeIn{
  from{
    opacity:0;
    transform:translateY(8px);
  }
  to{
    opacity:1;
    transform:translateY(0);
  }
}
    </style>
  </head>
  <body>
    <div id="joinChat" class="joinChat">
      <div class="navbar">
        <h1>Misinformation Block Chat</h1>
      </div>
      <div id="error" class="error">
        <p id="errorText" class="errorText">Failure</p>
      </div>
      <input id="code" placeholder="Chat Code">
      <input id="username" placeholder="Username">
      <button class="joinButton" onclick="getChat()" id="joinButton">Join a Chat</button>
      <button class="createClass" onclick="createChat()">Create New Chat</button>
    </div>
    <div id="chat">
      <div class="navbar">
        <h1 id="codeTextTitle">Misinformation Block Chat</h1>


      </div>
      <div id="messageDiv" class="messages">
        </div>
      <input id="postMessage" placeholder="Send your message">
        <button onclick="sendMessage()">Send Post</button>
    </div>
<script>

let renderedKeys = new Set();
let pollingStarted = false;

async function getChat(){

    const username = document.getElementById("username").value;
    const code = document.getElementById("code").value;

    const data = { code };

    const response = await fetch('/getChat', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    });

    const chatData = await response.json();

    if (chatData.error === false){

        document.getElementById("error").style.display = "block";
        document.getElementById("errorText").innerText =
            "The code is incorrect or the username has been taken.";

        return;
    }

    document.getElementById("joinChat").style.display = "none";
    document.getElementById("chat").style.display = "block";
    document.getElementById("codeTextTitle").innerHTML = code;

    if (!pollingStarted){
        setInterval(getMessages, 1000);
        pollingStarted = true;
    }

    getMessages();
}

async function sendMessage(){

    const data = {
        message: document.getElementById("postMessage").value,
        code: document.getElementById("code").value,
        username: document.getElementById("username").value
    };

    await fetch('/sendMessage', {
        method: 'POST',
        headers: {
            'Content-Type': 'application/json'
        },
        body: JSON.stringify(data)
    });

    document.getElementById("postMessage").value = "";

    getMessages();
}

async function getMessages(){

    const code = document.getElementById("code").value;

    const response = await fetch("/getAllMessages", {
        method: "POST",
        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify({ code })
    });

    const messagesData = await response.json();

    const container = document.getElementById("messageDiv");

    const messages = messagesData.messages;

    // messages is a DICT: { user: message }

    for (const user in messages){

        const key = user + "|" + messages[user];

        if (!renderedKeys.has(key)){

            const newDiv = document.createElement("div");

            newDiv.className = "message";

            newDiv.innerHTML = `
                <div class="username"><b>${user}</b></div>
                <p>${messages[user]}</p>
            `;

            container.appendChild(newDiv);
            renderedKeys.add(key);

            container.scrollTop = container.scrollHeight;
        }
    }
}

</script>
  </body>
</html>
