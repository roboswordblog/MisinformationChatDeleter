<!DOCTYPE HTML>
<html>
  <head>
    <title>Chat</title>
     <style>
      *{
        margin:0;
        padding:0;
        box-sizing:border-box;
        font-family:Arial, Helvetica, sans-serif;
      }

      body{
        background:#0f1117;
        color:#f1f1f1;
        min-height:100vh;
        display:flex;
        justify-content:center;
        align-items:center;
      }

      #chat{
        display:none;
      }

      #error{
        display:none;
      }

      .joinChat,
      #chat{
        width:90%;
        max-width:500px;
        background:#1a1d26;
        border:1px solid #2a2f3a;
        border-radius:16px;
        overflow:hidden;
        box-shadow:0 0 25px rgba(0,0,0,0.4);
      }

      .navbar{
        background:#151821;
        padding:20px;
        border-bottom:1px solid #2a2f3a;
      }

      .navbar h1{
        font-size:24px;
        color:#7aa2ff;
        text-align:center;
      }

      .joinChat{
        padding-bottom:25px;
      }

      input{
        width:calc(100% - 40px);
        margin:20px 20px 0 20px;
        padding:14px;
        border:none;
        border-radius:10px;
        background:#262b36;
        color:white;
        font-size:16px;
        outline:none;
        transition:0.2s;
      }

      input::placeholder{
        color:#9aa4b2;
      }

      input:focus{
        border:1px solid #7aa2ff;
        box-shadow:0 0 10px rgba(122,162,255,0.3);
      }

      button{
        width:calc(100% - 40px);
        margin:20px 20px 0 20px;
        padding:14px;
        border:none;
        border-radius:10px;
        font-size:16px;
        font-weight:bold;
        cursor:pointer;
        transition:0.2s;
      }

      .joinButton{
        background:#4f7cff;
        color:white;
      }

      .joinButton:hover{
        background:#3f6ef5;
        transform:translateY(-2px);
      }

      .createClass{
        background:#2f3542;
        color:#f1f1f1;
      }

      .createClass:hover{
        background:#3c4454;
        transform:translateY(-2px);
      }

      .error{
        margin:20px;
        padding:14px;
        border-radius:10px;
        background:#3a1f25;
        border:1px solid #ff4d6d;
      }

      .errorText{
        color:#ff8fa3;
        text-align:center;
        font-size:15px;
      }
    </style>
  </head>
  <body>
    <div id="joinChat" class="joinChat">
      <div class="navbar">
        <h1>Misinformation Block Chat</h1>
      </div>
      <div id="error" class="error">
        <p id="errorText" class="errorText">Failure</p>
      </div>
      <input id="code" placeholder="Chat Code">
      <input id="username" placeholder="Username">
      <button class="joinButton" onclick="getChat()" id="joinButton">Join a Chat</button>
      <button class="createClass" onclick="createChat()">Create New Chat</button>
    </div>
    <div id="chat">
      <div class="navbar">
        <h1>Misinformation Block Chat</h1>
      </div>
    </div>
    <script>
      var code;
      var chatData = {};
      async function showChat(){
        
      }
     async function getChat(){
      var username = document.getElementById("username");
      var code = document.getElementById("code");
      data = {"username":username, "code":code}
      chatData = await fetch('/getChat', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json'
            },
            body: JSON.stringify(data)
        });
      }
      if (chatData.error === true){
        document.getElementById("error").style.display = "block"
        document.getElementById("errorText").innerText = "The code is incorrect or the username has been taken. Please try getting the correct code or switching to a different username"
      }

    </script>
  </body>
</html>
